<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>joey luvs u &lt;3</title>
  <link rel="icon" type="image/png" href="./assets/logo.png" id="tab-favicon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-accent: #f97316;
      --bg-glass: rgba(10, 16, 32, 0.8);
      --border-glass: rgba(249, 115, 22, 0.32);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      min-height: 100vh;
      background: #060a15;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    #winter-campfire-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      display: block;
    }

    .page-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      padding: 20px 24px 32px;
    }

    /* Header */
    .hub-header {
      width: 100%;
      max-width: 820px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(10, 16, 32, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }

    .logo-img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.6));
    }

    .logo-text {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .panic-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .panic-btn:hover {
      background: rgba(239, 68, 68, 0.35);
      color: #fff;
    }

    .panic-btn kbd {
      background: rgba(0, 0, 0, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-family: monospace;
    }

    /* Main Container */
    .hub-main {
      width: 100%;
      max-width: 820px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    .hub-hero-card {
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      padding: 38px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 45px rgba(249, 115, 22, 0.12);
      position: relative;
      overflow: hidden;
    }

    .hub-hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f97316 0%, #fbbf24 45%, #ef4444 100%);
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.8);
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 22px;
      color: #fff;
      line-height: 1.15;
    }

    .hero-title span {
      background: linear-gradient(135deg, #f97316 0%, #fbbf24 60%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Live Link Panel */
    .link-showcase-panel {
      background: rgba(6, 10, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 22px;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .link-meta {
      flex: 1;
      min-width: 220px;
    }

    .link-url-text {
      font-family: 'JetBrains Mono', Consolas, monospace;
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      word-break: break-all;
    }

    .copy-link-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-link-btn:hover {
      background: rgba(51, 65, 85, 1);
      border-color: rgba(249, 115, 22, 0.5);
    }

    /* Actions Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-launch-primary {
      flex: 2;
      min-width: 220px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 28px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(249, 115, 22, 0.45);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-launch-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(249, 115, 22, 0.65);
      background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
    }

    .btn-refresh-hub {
      flex: 1;
      min-width: 140px;
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f8fafc;
      font-weight: 700;
      font-size: 14px;
      padding: 16px 20px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-refresh-hub:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(249, 115, 22, 0.45);
    }

    /* Countdown */
    .countdown-wrapper {
      margin-top: 20px;
      padding: 12px 18px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
      color: #e2e8f0;
      flex-wrap: wrap;
    }

    .countdown-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .countdown-track {
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    .countdown-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #10b981, #f97316);
      border-radius: 999px;
      transition: width 1s linear;
    }

    .btn-cancel-countdown {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel-countdown:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
    }

    @media (max-width: 640px) {
      .page-wrapper {
        padding: 14px 14px 24px;
      }
      .hub-hero-card {
        padding: 24px 18px;
        border-radius: 18px;
      }
      .hero-title {
        font-size: 1.8rem;
      }
      .actions-row {
        flex-direction: column;
      }
      .btn-launch-primary,
      .btn-refresh-hub {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    
    <header class="hub-header">
      <a href="./" class="logo-group">
        <img src="./assets/logo.png" class="logo-img" alt="logo">
        <span class="logo-text">joey luvs u &lt;3</span>
      </a>
      
      <button class="panic-btn" id="panic-btn" title="Emergency escape">
        <span>Panic</span>
        <kbd>ESC</kbd>
      </button>
    </header>

    <main class="hub-main">
      <section class="hub-hero-card">
        <h1 class="hero-title">
          joey luvs u <span>&lt;3</span>
        </h1>

        <div class="link-showcase-panel">
          <div class="link-meta">
            <span class="link-url-text" id="link-url">Checking live link...</span>
          </div>
          <button class="copy-link-btn" id="btn-copy">
            <span>📋</span>
            <span id="copy-text">Copy</span>
          </button>
        </div>

        <div class="actions-row">
          <a href="#" id="btn-launch" class="btn-launch-primary">
            <span>Enter Site</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
          <button class="btn-refresh-hub" id="btn-refresh">
            <span>🔄</span>
            <span>Refresh</span>
          </button>
        </div>

        <div class="countdown-wrapper" id="countdown-bar">
          <div class="countdown-info">
            <span id="countdown-text">Opening in <b id="countdown-sec">4</b>s</span>
            <div class="countdown-track">
              <div class="countdown-fill" id="countdown-fill"></div>
            </div>
          </div>
          <button class="btn-cancel-countdown" id="btn-cancel">Stay</button>
        </div>
      </section>
    </main>

  </div>

  <!-- Animated Winter Campfire Canvas Background -->
  <script src="./winter-campfire.js"></script>

  <script>
    function panic() {
      window.location.replace("https://classroom.google.com");
    }
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") panic();
    });
    document.getElementById("panic-btn").onclick = panic;

    let activeLink = "";
    let countdown = 4;
    const initialCountdown = 4;
    let timer = null;
    let cancelled = false;

    async function loadLink() {
      const urlEl = document.getElementById("link-url");
      const launchBtn = document.getElementById("btn-launch");

      let found = "";
      let foundTime = 0;

      const sources = [
        "https://raw.githubusercontent.com/tsgshortguy/joeys-mojis-hub/main/current_link.json?t=" + Date.now(),
        "./current_link.json?t=" + Date.now()
      ];

      for (const src of sources) {
        try {
          const res = await fetch(src, { cache: "no-store" });
          if (res.ok) {
            const data = await res.json();
            const time = data.updatedAt || 0;
            if (data.link && (!found || time > foundTime)) {
              found = data.link;
              foundTime = time;
            }
          }
        } catch (_) {}
      }

      if (found) {
        activeLink = found;
        urlEl.textContent = activeLink;
        launchBtn.href = activeLink;
        startCountdown();
        return true;
      } else {
        urlEl.textContent = "Updating link...";
        return false;
      }
    }

    function startCountdown() {
      if (cancelled || !activeLink) return;
      const secEl = document.getElementById("countdown-sec");
      const fillEl = document.getElementById("countdown-fill");

      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        countdown--;
        if (secEl) secEl.textContent = countdown;
        if (fillEl) {
          const pct = Math.max(0, (countdown / initialCountdown) * 100);
          fillEl.style.width = pct + "%";
        }
        if (countdown <= 0) {
          clearInterval(timer);
          if (activeLink && !cancelled) {
            window.location.href = activeLink;
          }
        }
      }, 1000);
    }

    document.getElementById("btn-cancel").onclick = () => {
      cancelled = true;
      if (timer) clearInterval(timer);
      const bar = document.getElementById("countdown-bar");
      if (bar) bar.style.display = "none";
    };

    document.getElementById("btn-copy").onclick = () => {
      if (activeLink) {
        navigator.clipboard.writeText(activeLink);
        const copyText = document.getElementById("copy-text");
        const orig = copyText.textContent;
        copyText.textContent = "Copied!";
        setTimeout(() => copyText.textContent = orig, 1800);
      }
    };

    const refreshBtn = document.getElementById("btn-refresh");
    if (refreshBtn) {
      refreshBtn.onclick = async () => {
        const orig = refreshBtn.innerHTML;
        refreshBtn.innerHTML = "<span>⏳</span><span>Checking...</span>";
        refreshBtn.disabled = true;
        const ok = await loadLink();
        if (ok) {
          refreshBtn.innerHTML = "<span>✅</span><span>Updated!</span>";
        } else {
          refreshBtn.innerHTML = "<span>⚠️</span><span>Try Again</span>";
        }
        setTimeout(() => {
          refreshBtn.innerHTML = orig;
          refreshBtn.disabled = false;
        }, 1200);
      };
    }

    loadLink();
  </script>
</body>
</html>
